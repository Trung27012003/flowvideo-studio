name: Build and media smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Studio.Web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: dotnet build src/Studio.Api -c Release
      - run: npm ci && npm run build
        working-directory: src/Studio.Web
      - run: python3 scripts/smoke.py
      - name: Assemble runnable artifact
        run: |
          dotnet publish src/Studio.Api -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r src/Studio.Web/dist/web/browser/. publish/wwwroot/
      - uses: actions/upload-artifact@v4
        with:
          name: flowvideo-studio
          path: publish/
